<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome</title>
</head>
<body>
<div class="app-container">
    <aside class="sidebar left-sidebar">
        <div class="panel-header">
            <h3>Controls</h3>
        </div>
        <div class="control-buttons">
            <button class="action-btn" id="expandAllBtn">Expand All</button>
            <button class="action-btn" id="collapseAllBtn">Collapse All</button>
            <button class="action-btn reset-btn" id="resetBtn">Reset Stats</button>
        </div>
        <div class="stat-box">
            <span class="stat-label">Active pages</span>
            <span class="stat-value" id="activeCount">1 / 10</span>
        </div>
    </aside>
    <main class="main-content">
        <div class="dashboard-header">
            <h2>Game Design & Development</h2>
            <span class="badge" id="clickCounter">Clicks: 0</span>
        </div>
        
        <div class="accordion-container" id="accordionContainer"></div>
        <div class="dashboard-footer-logo">
            <a href="https://lanzo.com" target="_blank" class="lanzo-brand">
                <div class="brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">Lanzo<span class="domain">.com</span></span>
                </div>
            </a>
        </div>
    </main>
    <aside class="sidebar right-sidebar">
        <div class="panel-header">
            <h3>Activity Log</h3>
            <span class="live-dot"></span>
        </div>
        <ul class="activity-feed" id="activityFeed">
            <li class="feed-item placeholder">No interactions yet...</li>
        </ul>
    </aside>

</div>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</body>
</html>
